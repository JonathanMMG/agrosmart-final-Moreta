services:
  postgres:
    image: 'postgres:latest'
    container_name: agrosmart-postgres
    environment:
      POSTGRES_DB: agrosmart_db
      POSTGRES_USER: agrosmart
      POSTGRES_PASSWORD: agrosmart
    ports:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agrosmart -d agrosmart_db']
      interval: 5s
      timeout: 5s
      retries: 10
